<div id="chat-manager-shadow-overlay" class="chat-manager-shadow-overlay">
    <div id="chat-manager-popup" class="chat-manager-popup">
        <div class="chat-manager-popup-header">
            <h3 class="chat-manager-title">Chat Manager</h3>
            <button type="button" id="chat-manager-popup-close" class="chat-manager-btn chat-manager-close" title="Close Chat Manager popup" aria-label="Close Chat Manager popup"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            <div class="chat-manager-header-actions" role="group" aria-label="Chat tools and views">
                <button type="button" id="chat-manager-recent-swipes" class="chat-manager-btn chat-manager-labeled-btn" title="Read the latest reply and compare its swipes" aria-haspopup="dialog"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>Recent swipes</span></button>
                <button type="button" id="chat-manager-branch-context-toggle" class="chat-manager-btn chat-manager-labeled-btn chat-manager-branch-ctx-toggle" title="Include sibling branches in AI prompts" aria-pressed="false"><i class="fa-solid fa-code-branch" aria-hidden="true"></i><span>Branch context</span></button>
                <button type="button" id="chat-manager-stats-toggle" class="chat-manager-btn chat-manager-labeled-btn chat-manager-stats-toggle" title="Show chat statistics; click again to return to threads" aria-pressed="false"><i class="fa-solid fa-chart-bar" aria-hidden="true"></i><span>Stats</span></button>
                <button type="button" id="chat-manager-graph-view-toggle" class="chat-manager-btn chat-manager-labeled-btn chat-manager-graph-view-toggle" title="Explore connections between chats; click again to return to threads" aria-pressed="false"><i class="fa-solid fa-diagram-project" aria-hidden="true"></i><span>Chat graph</span></button>
                <button type="button" id="chat-manager-semantic-map-toggle" class="chat-manager-btn chat-manager-labeled-btn chat-manager-semantic-map-toggle" title="Explore messages by topic similarity; click again to return to threads" aria-pressed="false"><i class="fa-solid fa-map-location-dot" aria-hidden="true"></i><span>Topic map</span></button>
                <button type="button" id="chat-manager-timeline-toggle" class="chat-manager-btn chat-manager-labeled-btn chat-manager-timeline-toggle" title="Explore chat branches and messages over time; click again to return to threads" aria-pressed="false"><i class="fa-solid fa-timeline" aria-hidden="true"></i><span>Timeline</span></button>
            </div>
        </div>
        <div class="chat-manager-search-wrapper">
            <div class="chat-manager-search-row">
                <input type="text" id="chat-manager-search" class="chat-manager-search-input" placeholder="Search messages across all threads..." />
            </div>
            <div class="chat-manager-search-ai-row">
                <label for="chat-manager-search-ai-profile" class="chat-manager-search-ai-label">AI Profile</label>
                <select id="chat-manager-search-ai-profile" class="chat-manager-search-ai-profile chat-manager-ai-profile-select">
                    <option value="">Current Connection</option>
                </select>
            </div>
        </div>
        <div id="chat-manager-status" class="chat-manager-status">Showing summaries</div>
        <div id="chat-manager-branch-context-indicator" class="chat-manager-branch-ctx-indicator" style="display:none;"></div>
        <div id="chat-manager-content" class="chat-manager-content">
            <!-- Thread cards or search results rendered here -->
        </div>
    </div>
</div>
