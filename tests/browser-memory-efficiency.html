<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Chat Manager memory efficiency checks</title>
<style>body{background:#18212b;color:#e4e9ee;font:15px system-ui;margin:24px}pre{white-space:pre-wrap}button{padding:8px}#chat-manager-content{max-height:250px;overflow:auto}</style>
<h1>Memory efficiency integration checks</h1><button id="run">Run checks</button>
<pre id="results">Ready. Synthetic data, isolated IndexedDB, mocked provider.</pre>
<div class="chat-manager-search-wrapper"><div class="chat-manager-search-row"><input id="chat-manager-search"></div></div>
<div id="chat-manager-status"></div><div id="chat-manager-content"></div>
<script type="module">
import { pca3D, pca3DAsync } from '../src/semantic-engine.js';
import { getIndex, clearIndex, setMessageEmbedding } from '../src/chat-reader.js';
import { getEmbeddingSettings, setEmbeddingSettings } from '../src/metadata-store.js';
import { performSearch, resetSearchState } from '../src/ui-controller.js';
const results = document.getElementById('results');
const pause = () => new Promise(resolve => setTimeout(resolve, 0));
const assert = (condition, label) => { if (!condition) throw Error(label); results.textContent += `PASS ${label}\n`; };
const open = (name, version, upgrade) => new Promise((resolve, reject) => {
    const request = indexedDB.open(name, version);
    request.onupgradeneeded = () => upgrade?.(request.result);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
});
const transaction = (db, names, mode, apply) => new Promise((resolve, reject) => {
    const tx = db.transaction(names, mode);
    apply(tx);
    tx.oncomplete = resolve;
    tx.onerror = tx.onabort = () => reject(tx.error || Error('Transaction aborted'));
});
document.getElementById('run').onclick = async () => {
    results.textContent = '';
    const dbName = `chat-manager-memory-test-${crypto.randomUUID()}`;
    const nativeGet = IDBObjectStore.prototype.get;
    const nativeFetch = window.fetch;
    let db, moduleURL, timer;
    try {
        db = await open(dbName, 3, database => {
            database.createObjectStore('chats', { keyPath: 'key' });
            database.createObjectStore('chatMetadata', { keyPath: 'key' });
        });
        await transaction(db, 'chats', 'readwrite', tx => tx.objectStore('chats').put({ key:'fixture:legacy', messages:[{text:'old uncapped body'}] }));
        db.close();
        const original = await (await fetch('../src/cache-store.js')).text();
        const source = original.replace("const DB_NAME = 'chat_manager_cache';", `const DB_NAME = ${JSON.stringify(dbName)};`)
            .replace(/from '(\.\/[^']+)'/g, (_match, relative) => `from '${new URL(`../src/${relative.slice(2)}`, import.meta.url).href}'`);
        assert(source !== original, 'cache fixture uses a unique isolated database');
        moduleURL = URL.createObjectURL(new Blob([source], {type:'text/javascript'}));
        const cache = await import(moduleURL);
        assert((await cache.getCachedSummaries('fixture')).size === 0, 'an upgraded database starts with no summaries');
        db = await open(dbName, 4);
        const stores = [...db.objectStoreNames].sort().join();
        assert(stores === 'chatBodies,chatBodyLedger,chatDescriptors,chatSummaries', 'real IndexedDB upgrade replaces the old uncapped stores');
        const names = Array.from({length:121}, (_, i) => `fresh-${i}`);
        const validity = { lastModified:1, serverSignature:'current', validatedAt:7, messageCount:1 };
        await cache.putCachedChats('fixture', names.map(fileName => ({ fileName, entry:{ ...validity, lastMessagePreview:fileName }, descriptorsPayload:'[]' })));
        await cache.putCachedChat('other', 'other.jsonl', validity);
        await cache.flushPendingCacheWrites();
        let summaries = 0;
        const nativeGetAll = IDBIndex.prototype.getAll;
        IDBIndex.prototype.getAll = function(...args) { if (this.objectStore.transaction.db.name === dbName) summaries++; return nativeGetAll.apply(this, args); };
        const restored = await cache.getCachedSummaries('fixture');
        IDBIndex.prototype.getAll = nativeGetAll;
        assert(restored.size === 121 && summaries === 1, 'one real read restores a whole character');
        assert([...restored].every(([name, record]) => record.lastMessagePreview === name && record.validatedAt === 7), 'summaries keep their contents');
        assert(!restored.has('other.jsonl'), 'summaries are separated by character');
        assert((await cache.getCachedDescriptors('fixture', 'fresh-3')).payload === '[]', 'per-message rows are stored separately');
        const body = (fileName, bodyBytes, evictBodies = true) => cache.putCachedChat('fixture', fileName, { ...validity, bodyBytes }, { body:[{ text:fileName }], evictBodies });
        const stored = async fileName => (await cache.getCachedBody('fixture', fileName))?.messages[0].text ?? null;
        cache.setBodyStoreBudget(1000);
        await body('a', 400); await body('b', 400);
        await body('scan', 400, false);
        assert(await stored('scan') === null, 'an archive scan does not evict stored bodies');
        await new Promise(resolve => setTimeout(resolve, 5));
        await stored('a');
        await body('c', 400);
        assert(await stored('c') === 'c' && await stored('a') === 'a' && await stored('b') === null, 'a single read evicts the least recently used body in real IndexedDB');
        await cache.removeCachedChat('fixture', 'a');
        assert(await stored('a') === null && cache.getBodyStoreStats().storedBytes === 400, 'removing a chat frees its stored space');
        db.close();

        const small = Array.from({length:30}, (_, i) => [3, Math.sin(i), Math.cos(i * .3), i / 10]);
        const expected = pca3D(small), actual = await pca3DAsync(small);
        assert(actual.projected.every((row, i) => row.every((v, d) => Math.abs(v - expected.projected[i][d]) < 2e-6)), 'matrix-free PCA agrees with reference projection in the browser');
        const wide = Array.from({length:128}, (_, i) => Array.from({length:3072}, (_, d) => Math.sin(i * .13) * Math.cos(d * .1) + .3 * Math.cos(i * .27) * Math.sin(d * .17)));
        let ticks = 0; timer = setInterval(() => ticks++, 0);
        const projected = await pca3DAsync(wide); clearInterval(timer); timer = null;
        assert(ticks > 2 && projected.projected.flat().every(Number.isFinite), 'wide PCA yields to browser timers throughout computation');

        const store = new Map();
        const context = {characterId:0,characters:[{avatar:'fixture.png'}],extensionSettings:{},chat:[],saveSettingsDebounced(){}};
        window.SillyTavern = {getContext:() => context, libs:{DOMPurify:{sanitize:html => html},moment:() => ({isValid:() => false}),localforage:{createInstance:() => ({
            getItem:async key => store.get(key) ?? null, setItem:async (key, value) => {store.set(key,value);return value;}, clear:async () => store.clear(),
        })}}};
        window.fetch = async () => ({ok:true,text:async () => JSON.stringify({embeddings:[[1,0]]})});
        clearIndex(); setEmbeddingSettings({enabled:true,provider:'ollama',model:'fixture',dimensions:null,embeddingLevels:{message:true,chat:false,query:true},includeAlternateSwipes:true,showAlternateSwipesInResults:true});
        const msg = {filename:'fixture.jsonl',index:0,text:'active unrelated prose',swipes:['active unrelated prose','alternate swords'],swipeId:0,role:'assistant'};
        const entry = getIndex()[msg.filename] = {fileName:msg.filename,isLoaded:true,messages:[msg],messageEmbeddings:new Map()};
        setMessageEmbedding(entry,0,0,[0,1]); setMessageEmbedding(entry,0,1,[1,0]);
        document.getElementById('chat-manager-search').value = 'swords';
        await performSearch('swords');
        assert(getEmbeddingSettings().dimensions === 2, 'mocked first query learns embedding dimensions');
        assert(document.querySelector('.chat-manager-search-result')?.textContent.includes('alternate swords'), 'first semantic query renders the matched alternate after learning dimensions');
        assert(document.getElementById('chat-manager-status').textContent.includes('Found 1 match'), 'semantic match count remains exact');
        resetSearchState();
        results.textContent += 'ALL BROWSER CHECKS PASSED';
    } catch (error) {
        results.textContent += `FAIL ${error.stack}`;
    } finally {
        if (timer) clearInterval(timer);
        IDBObjectStore.prototype.get = nativeGet; window.fetch = nativeFetch;
        db?.close(); if (moduleURL) URL.revokeObjectURL(moduleURL);
        indexedDB.deleteDatabase(dbName);
    }
};
</script></html>
